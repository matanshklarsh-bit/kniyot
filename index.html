:root {
  --accent: #F97316;
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --text: #1F2937;
  --muted: #6B7280;
  --line: #F1E6DA;
  --shadow: 0 2px 0 rgba(0,0,0,.04), 0 6px 18px rgba(120, 72, 20, .08);
  --radius: 20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: 'Rubik', -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: 17px; line-height: 1.4;
  min-height: 100vh; min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
h1, h3 { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
#app { max-width: 640px; margin: 0 auto; padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 110px); }

/* ---------- Pick user ---------- */
.pick { text-align: center; padding-top: 12vh; }
.pick-logo { font-size: 72px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
.pick h1 { font-size: 34px; font-weight: 700; margin: 8px 0 4px; }
.pick-users { display: flex; gap: 14px; justify-content: center; margin: 28px 0 20px; }
.pick-user {
  flex: 1; max-width: 170px; padding: 22px 10px; border-radius: 24px;
  background: var(--c); color: #fff; font-size: 22px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 70%, #000), 0 12px 24px color-mix(in srgb, var(--c) 30%, transparent);
  transition: transform .1s;
}
.pick-user:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 70%, #000); }
.pick-emoji { font-size: 44px; background: rgba(255,255,255,.25); border-radius: 50%; width: 72px; height: 72px; display: grid; place-items: center; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px 10px; }
.hello { color: var(--muted); font-weight: 500; }
.home-head h1 { font-size: 30px; font-weight: 700; }
.avatar { width: 52px; height: 52px; border-radius: 50%; font-size: 28px; background: color-mix(in srgb, var(--c) 18%, #fff); border: 3px solid var(--c); }

.status { font-size: 14px; font-weight: 500; border-radius: 999px; padding: 6px 14px; margin: 0 auto 12px; width: fit-content; display: none; }
.status.ok { display: block; background: #DCFCE7; color: #166534; }
.status.sync { display: block; background: #FEF3C7; color: #92400E; }
.status.off { display: block; background: #E0E7FF; color: #3730A3; }
.demo-note { background: #FEF3C7; color: #92400E; font-size: 14px; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; text-align: center; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  position: relative; overflow: hidden; text-align: right;
  border-radius: 24px; padding: 16px 16px 14px; min-height: 150px;
  background: var(--c); color: #fff;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 72%, #000), 0 10px 22px color-mix(in srgb, var(--c) 28%, transparent);
  transition: transform .1s;
}
.tile::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.15); left: -30px; bottom: -40px; }
.tile:active { transform: translateY(3px); }
.tile-icon { font-size: 40px; line-height: 1; margin-bottom: 8px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.15)); }
.tile-name { font-size: 21px; font-weight: 700; }
.tile-count { font-size: 14px; font-weight: 500; opacity: .95; }
.tile-preview { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 4px; position: relative; z-index: 1; }
.tile-add { --c: #fff; background: transparent; color: var(--muted); border: 3px dashed #E5D5C3; box-shadow: none; align-items: center; justify-content: center; }
.tile-add::after { display: none; }
.tile-add .tile-icon { font-size: 34px; filter: none; }
.tile-add .tile-name { font-size: 17px; }

.bottom-bar, .finish-bar {
  position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(var(--safe-b) + 12px);
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  display: flex; justify-content: center;
}
.finish-bar { transform: translateY(120%); transition: transform .25s cubic-bezier(.2,.9,.3,1.2); }
.finish-bar.show { transform: none; }

/* ---------- Buttons ---------- */
.btn { border-radius: 16px; padding: 13px 18px; font-weight: 700; font-size: 17px; }
.btn.big { width: 100%; max-width: 608px; padding: 17px; font-size: 19px; border-radius: 20px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 70%, #000); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 70%, #000); }
.btn.ghost { background: #F3EDE6; color: var(--text); }
.btn.danger { background: #EF4444; color: #fff; box-shadow: 0 4px 0 #B91C1C; }
.btn.danger-ghost { background: #FEE2E2; color: #B91C1C; }
.btn.full { width: 100%; margin-top: 8px; }
.history-btn { background: #fff; color: var(--text); box-shadow: var(--shadow); border: 2px solid var(--line); }

/* ---------- List view ---------- */
.list-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--accent); color: #fff; margin: calc(-12px - var(--safe-t)) -16px 14px;
  padding: calc(var(--safe-t) + 14px) 14px 18px; border-radius: 0 0 28px 28px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
}
.list-head h1 { font-size: 24px; font-weight: 700; flex: 1; text-align: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.22); font-size: 24px; font-weight: 700; display: grid; place-items: center; color: #fff; }
.ghost-space { background: none; }

.add-bar {
  position: sticky; top: calc(var(--safe-t) + 8px); z-index: 5;
  display: flex; gap: 8px; background: #fff; padding: 8px; border-radius: 20px;
  box-shadow: var(--shadow); border: 2px solid color-mix(in srgb, var(--accent) 35%, #fff); margin-bottom: 14px;
}
.add-bar input { border: 0; outline: 0; background: transparent; min-width: 0; font-size: 18px; padding: 8px 6px; }
.add-name { flex: 1; }
.add-qty { width: 76px; border-right: 2px solid var(--line) !important; text-align: center; font-size: 16px !important; }
.add-btn { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 28px; font-weight: 700; flex: none; }

.items { display: flex; flex-direction: column; gap: 8px; }
.item {
  display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px;
  padding: 8px 12px 8px 10px; min-height: 62px; box-shadow: var(--shadow);
  border-right: 6px solid var(--accent); animation: pop .22s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.check {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  border: 3px solid color-mix(in srgb, var(--accent) 60%, #fff); color: #fff; font-weight: 700; font-size: 20px;
  display: grid; place-items: center; transition: background .15s, transform .1s;
}
.check:active { transform: scale(.88); }
.item-body { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; cursor: pointer; }
.item-name { font-size: 19px; font-weight: 500; word-break: break-word; }
.qty { display: inline-block; font-size: 14px; font-weight: 700; background: color-mix(in srgb, var(--accent) 15%, #fff); color: color-mix(in srgb, var(--accent) 70%, #000); border-radius: 999px; padding: 1px 10px; margin-inline-start: 6px; vertical-align: 2px; }
.by { font-size: 12px; font-weight: 700; color: var(--u); background: color-mix(in srgb, var(--u) 12%, #fff); padding: 3px 9px; border-radius: 999px; flex: none; }
.item.checked { background: #F4F1ED; box-shadow: none; border-right-color: #D6CEC4; animation: none; }
.item.checked .check { background: var(--accent); border-color: var(--accent); }
.item.checked .item-name { text-decoration: line-through; color: #9CA3AF; }
.item.checked .qty, .item.checked .by { filter: grayscale(1); opacity: .6; }
.section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 14px 6px 2px; }
.all-done { text-align: center; font-size: 20px; font-weight: 700; padding: 18px; color: var(--accent); }
.empty { text-align: center; padding: 50px 20px; font-size: 19px; font-weight: 500; }
.empty-icon { font-size: 64px; margin-bottom: 8px; opacity: .9; }
.loading { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--muted); }

/* ---------- History ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-weight: 500; font-size: 15px; }
.chip.on { background: var(--text); color: #fff; border-color: var(--text); }
.trips { display: flex; flex-direction: column; gap: 8px; }
.trip { background: #fff; border-radius: 18px; box-shadow: var(--shadow); border-right: 6px solid var(--c); overflow: hidden; }
.trip summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.trip summary::-webkit-details-marker { display: none; }
.trip-icon { font-size: 30px; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, #fff); flex: none; }
.trip-main { flex: 1; display: flex; flex-direction: column; }
.trip ul { margin: 0; padding: 4px 18px 14px 18px; list-style: none; border-top: 2px dashed var(--line); }
.trip li { padding: 7px 0; border-bottom: 1px solid #F6F0EA; }
.trip li:last-child { border-bottom: 0; }
.trip li::before { content: '✓'; color: var(--c); font-weight: 700; margin-inline-end: 8px; }
.trip .qty { --accent: var(--c); }

/* ---------- Sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(30, 20, 10, .35); opacity: 0; transition: opacity .2s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto;
  background: #fff; border-radius: 28px 28px 0 0; padding: 22px 18px calc(var(--safe-b) + 18px);
  transform: translateY(100%); transition: transform .22s ease-out; max-height: 90vh; overflow-y: auto;
}
.sheet::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: #E5DDD3; margin: -10px auto 14px; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.sheet h3 { font-size: 22px; margin-bottom: 12px; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 18px; outline: 0; background: #FFFCF8; }
.field input:focus { border-color: var(--accent); }
.row-btns { display: flex; gap: 10px; margin-top: 8px; }
.row-btns .btn { flex: 1; }
.menu-item { display: block; width: 100%; text-align: right; padding: 15px 12px; font-size: 18px; font-weight: 500; border-radius: 14px; }
.menu-item:active { background: #F6F0EA; }
.menu-item.danger { color: #DC2626; }
.icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.pick-icon { font-size: 26px; aspect-ratio: 1; border-radius: 12px; background: #F8F3EE; }
.pick-icon.on { background: color-mix(in srgb, var(--accent) 20%, #fff); outline: 3px solid var(--accent); }
.color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.pick-color { width: 38px; height: 38px; border-radius: 50%; background: var(--c); }
.pick-color.on { outline: 3px solid var(--c); outline-offset: 3px; }

#toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 100px); transform: translate(-50%, 20px);
  background: #1F2937; color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
